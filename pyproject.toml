[project]
name = "conjunction-risk"
version = "0.1.0"
description = "Conjunction / collision risk assessment tool for satellite mission operations"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conjunction_risk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
